name: config-decrypt-bot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Skip if another run is already active
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          active=$(gh run list --workflow=bot.yml --status in_progress \
            --json databaseId \
            --jq "[.[] | select(.databaseId != ${{ github.run_id }})] | length")
          if [ "$active" -gt 0 ]; then
            echo "Bot is already running in another run; skipping."
            exit 0
          fi

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          LOG_LEVEL: INFO
        run: python bot.py
