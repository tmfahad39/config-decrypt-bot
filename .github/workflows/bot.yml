name: config-decrypt-bot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Skip if another run is already active
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          active=$(gh run list --workflow=bot.yml --status in_progress \
            --json databaseId \
            --jq "[.[] | select(.databaseId != ${{ github.run_id }})] | length")
          if [ "$active" -gt 0 ]; then
            echo "Bot is already running in another run; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip == 'false'

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip == 'false'
        with:
          python-version: '3.12'
          cache: pip

      - run: sudo apt-get update && sudo apt-get install -y argon2
        if: steps.guard.outputs.skip == 'false'
      - run: pip install -r requirements.txt
        if: steps.guard.outputs.skip == 'false'

      - name: Run bot
        if: steps.guard.outputs.skip == 'false'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          LOG_LEVEL: INFO
        run: python bot.py
