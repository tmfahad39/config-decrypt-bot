name: diag
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install python-telegram-bot==21.6
      - name: Run diag
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          python - <<'PY'
          import os, asyncio
          from telegram import Bot
          async def main():
              bot = Bot(os.environ["BOT_TOKEN"])
              me = await bot.get_me()
              print("BOT:", me.id, me.username)
              try:
                  chat = await bot.get_chat("@ultimatedecryption")
                  print("CHAT:", chat.id, chat.title, chat.type, getattr(chat,"username",None))
              except Exception as e:
                  print("GET_CHAT ERR:", repr(e))
              try:
                  m = await bot.get_chat_member("@ultimatedecryption", me.id)
                  print("BOT MEMBER STATUS:", m.status)
              except Exception as e:
                  print("GET_CHAT_MEMBER BOT ERR:", repr(e))
          asyncio.run(main())
          PY
