services:
  - type: worker
    name: config-decrypt-bot
    runtime: python
    plan: 0.5c-512mb
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: LOG_LEVEL
        value: INFO
